name: tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # The ashlar command: init, add, update, diff, check, shot, the MCP server.
  command:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ashlar_ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: dart pub get
      - run: dart test

  # Every component in every state, installed into the gallery as a user would, with
  # the tests each one brings.
  components:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
