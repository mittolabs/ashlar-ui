name: release

# release-please keeps a release pull request open that collects what lands on main;
# merging it is the decision to release (docs/engineering/releases.md in the workspace).
# One version for the repository: ashlar_ui and ashlar are released together, tagged
# v0.10.1. It then tags the release and writes the GitHub Release, and this starts the
# publish workflow on that tag: a tag made with this workflow's token starts no workflow by itself.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish both packages from the new tag
        run: gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref "${{ needs.release-please.outputs.tag }}"
