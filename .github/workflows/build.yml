name: build

# Both packages analyze, the CLI's bundled registry matches registry/, and pub would
# take each package as it stands.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ashlar_ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ashlar_ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: The bundled registry is registry/ as committed
        working-directory: .
        run: |
          dart run tool/bundle.dart
          git diff --exit-code -- packages/ashlar_ui/lib/src/registry.g.dart
      - name: Ready to publish
        run: dart pub publish --dry-run

  ashlar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ashlar
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.4"
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Ready to publish
        run: dart pub publish --dry-run
