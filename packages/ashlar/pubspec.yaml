name: ashlar
description: "The ashlar command: copies Ashlar UI's components into your app, yours to change. Install it with dart pub global activate ashlar."
version: 0.3.0
homepage: https://ui.ashlar.ke
repository: https://github.com/mittolabs/ashlar-ui/tree/main/packages/ashlar
topics: [ui, components, design-system, cli]

environment:
  sdk: ^3.9.0

executables:
  ashlar: ashlar

dependencies:
  ashlar_ui: ^0.10.0

dev_dependencies:
  lints: ^6.0.0
